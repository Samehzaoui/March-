<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion administrateur - MarchéTn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1b2d1e 0%, #2e7d32 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    max-width: 400px;
    width: 100%;
    border-radius: 18px;
    border: none;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-3">
      <div style="font-size:2.5rem;">🥕</div>
      <h1 class="h5 fw-bold mt-2 mb-0">Espace Administrateur</h1>
      <p class="text-muted small">MarchéTn — Fruits & Légumes</p>
    </div>

    {% if erreur %}
      <div class="alert alert-danger py-2 small">{{ erreur }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nom d'utilisateur</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="admin">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Mot de passe</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-success w-100 fw-semibold">Se connecter</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">
      <a href="{% url 'boutique:accueil' %}" class="text-muted">← Retour à la boutique</a>
    </p>
  </div>
</body>
</html>
