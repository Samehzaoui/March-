{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion administrateur - 9ouffty</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f1f11 0%, #1b2d1e 45%, #2e7d32 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  /* Formes flottantes en arrière-plan pour un fond plus travaillé */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .35;
    z-index: 0;
    animation: float 10s ease-in-out infinite;
  }
  .blob-1 { width: 320px; height: 320px; background: #66bb6a; top: -80px; left: -80px; animation-delay: 0s; }
  .blob-2 { width: 260px; height: 260px; background: #fdd835; bottom: -60px; right: -60px; animation-delay: 2s; }
  .blob-3 { width: 200px; height: 200px; background: #43a047; bottom: 30%; left: 8%; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-25px) translateX(15px); }
  }

  .login-card {
    max-width: 400px;
    width: 100%;
    border-radius: 20px;
    border: none;
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,.97);
  }

  /* Emplacement du logo : remplacez /static/img/logo.png par votre logo réel */
  .logo-wrap {
    width: 84px;
    height: 84px;
    margin: -60px auto 12px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
    border: 3px solid #2e7d32;
    overflow: hidden;
  }
  .logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .logo-fallback {
    font-size: 2.3rem;
    display: none;
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card login-card p-4 pt-0">
    <div class="logo-wrap">
      <img src="{% static 'img/logo.png' %}" alt="Logo 9ouffty"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="logo-fallback">🥕</span>
    </div>

    <div class="text-center mb-3">
      <h1 class="h5 fw-bold mt-2 mb-0">Espace Administrateur</h1>
      <p class="text-muted small">9ouffty — Fruits, Légumes, Poissons & Viandes</p>
    </div>

    {% if erreur %}
      <div class="alert alert-danger py-2 small">{{ erreur }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nom d'utilisateur</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="admin">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Mot de passe</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-success w-100 fw-semibold">Se connecter</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">
      <a href="{% url 'boutique:accueil' %}" class="text-muted">← Retour à la boutique</a>
    </p>
  </div>
</body>
</html>
