{% extends "base.html" %}
{% load static %}
{% block title %}{% block head_title %}{% endblock head_title %}{% endblock title %}
{% block main_wrapper %}
<div class="auth-page">
  <span class="auth-blob b1"></span><span class="auth-blob b2"></span><span class="auth-blob b3"></span>
  <div class="auth-card">
    <div class="auth-logo"><img src="{% static 'img/logo.png' %}" alt="9offty"></div>
    <div class="pt-3">
      {% block content %}{% endblock content %}
    </div>
  </div>
</div>
{% block extra_body %}{% endblock extra_body %}
{% endblock main_wrapper %}
